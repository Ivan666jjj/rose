<body>
<canvas id="c"></canvas>
<div class="sig" id="sig">PARTICLE BOUQUET · CANVAS</div>
<script>
(function(){
"use strict";

var cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,SEG=128;

function rnd(){ return Math.random(); }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function mix(a,b,t){ return a+(b-a)*t; }

/* ---------- 玫瑰几何 ---------- */
var RINGS=6, UNIT=112;
function ringParams(t){
  return { t:t, count:5+Math.round(t*5),
    R:(3+t*46)/UNIT, L:(46+t*74)*0.78/UNIT, H:(58-t*30)/UNIT,
    tilt0:0.08+t*0.62, curl:1.55-t*0.30,
    halfW:(20+t*34)/UNIT, cup:0.42-t*0.10, ruffle:0.10+t*0.20, angle0:t*1.15 };
}

function roseSamples(count){
  var petals=[], r, i;
  for (r=0;r<RINGS;r++){
    var ring=ringParams(r/(RINGS-1));
    for (i=0;i<ring.count;i++){
      petals.push({ ring:ring,
        ang: ring.angle0 + i*Math.PI*2/ring.count + (rnd()-0.5)*0.06,
        phase: rnd()*6.283, wscale: 0.92+rnd()*0.16 });
    }
  }
  var weights=petals.map(function(p){ return p.ring.L*p.ring.halfW*p.ring.count; });
  var total=weights.reduce(function(a,b){return a+b;},0);
  var out=[];
  for (var k=0;k<petals.length;k++){
    var n=Math.max(16, Math.round(count*weights[k]/total));
    for (var j=0;j<n;j++){
      var u=Math.pow(rnd(),0.78);
      var edge=rnd()<0.34;
      var v=edge?(rnd()<0.5?-1:1)*(1-Math.pow(rnd(),3)*0.10):rnd()*2-1;
      out.push({ pk:k,u:u,v:v,edge:edge, delay: petals[k].ring.t*0.17+0.18*u+rnd()*0.05 });
    }
  }
  return { petals:petals, samples:out };
}

function lineFor(ring, open){
  var o=0.30+0.70*open, t0=ring.tilt0*o, curl=ring.curl*(0.25+0.75*open), L=ring.L*(0.55+0.45*open);
  var line=new Float32Array((SEG+1)*3), rr=ring.R, yy=ring.H;
  for (var i=0;i<=SEG;i++){
    var u=i/SEG, phi=t0+curl*Math.pow(u,1.5);
    line[i*3]=rr; line[i*3+1]=yy; line[i*3+2]=phi;
    var phiN=t0+curl*Math.pow(Math.min(1,u+1/SEG),1.5);
    rr+=L*Math.sin(phiN)/SEG; yy+=L*Math.cos(phiN)/SEG;
  }
  return line;
}

function rosePose(rs, open){
  var lines=rs.petals.map(function(p){ return lineFor(p.ring, open); });
  var n=rs.samples.length, arr=new Float32Array(n*3);
  for (var i=0;i<n;i++){
    var s=rs.samples[i], petal=rs.petals[s.pk], line=lines[s.pk];
    var fi=s.u*SEG, i0=fi|0, fr=fi-i0, i1=Math.min(SEG,i0+1);
    var r0=line[i0*3], y0=line[i0*3+1], p0=line[i0*3+2];
    var r1=line[i1*3], y1=line[i1*3+1], p1=line[i1*3+2];
    var rr=r0+(r1-r0)*fr, yy=y0+(y1-y0)*fr, phi=p0+(p1-p0)*fr;
    var u=s.u, v=s.v;
    var hw=petal.ring.halfW*Math.sin(Math.PI*Math.pow(u,0.8))*(1-0.25*u)*petal.wscale;
    var nOff=hw*(petal.ring.cup*(1-v*v)*(1-0.45*u)
            + petal.ring.ruffle*v*v*u*u*(1+0.9*Math.sin(u*11+petal.phase)));
    var rp=rr+nOff*Math.cos(phi), yp=yy-nOff*Math.sin(phi);
    var ang=petal.ang+(v*hw)/Math.max(rp,0.05);
    arr[i*3]=rp*Math.cos(ang); arr[i*3+1]=yp-0.55; arr[i*3+2]=rp*Math.sin(ang);
  }
  return arr;
}

/* ---------- 花束 ---------- */
var ROSES=[
  [ 0.00, 0.26, 0.00, 0.80,  0.3,  0.00],
  [-0.80,-0.06,-0.10, 0.66, -0.6,  0.20],
  [ 0.80, 0.06,-0.06, 0.66,  0.9, -0.18]
];
var roseSets=[];

function buildBouquet(open){
  var pos=[],bud=[],col=[],siz=[],dly=[];
  ROSES.forEach(function(R,idx){
    var rs=roseSets[idx]; if(!rs) return;
    var P=rosePose(rs,open), B=rosePose(rs,0.06);
    var tx=R[0],ty=R[1],tz=R[2],sc=R[3],ry=R[4],tilt=R[5];
    var cy=Math.cos(ry), sy=Math.sin(ry), cx=Math.cos(tilt), sx=Math.sin(tilt);
    for (var i=0;i<rs.samples.length;i++){
      var s=rs.samples[i];
      [ [P,pos],[B,bud] ].forEach(function(pair){
        var src=pair[0], dst=pair[1];
        var x=src[i*3]*sc, y=src[i*3+1]*sc*1.35, z=src[i*3+2]*sc;
        var y2=y*cx-z*sx, z2=y*sx+z*cx;
        var x2=x*cy-z2*sy, z3=x*sy+z2*cy;
        dst.push(x2+tx, y2+ty, z3+tz);
      });
      var deep=[0.44,0.08,0.17], mid=[0.92,0.36,0.50], pale=[1.0,0.86,0.90];
      var lm=0.10+0.70*s.u;
      var cr=mix(deep[0],mid[0],lm), cg=mix(deep[1],mid[1],lm), cb=mix(deep[2],mid[2],lm);
      var br=0.40*Math.pow(s.u,2.2)+0.26*s.v*s.v;
      cr=mix(cr,pale[0],br); cg=mix(cg,pale[1],br); cb=mix(cb,pale[2],br);
      if (s.edge){ cr=mix(cr,1,0.24); cg=mix(cg,0.93,0.24); cb=mix(cb,0.95,0.24); }
      var dim=0.72+0.28*(R[2]+0.2)/0.4;
      col.push(cr*dim,cg*dim,cb*dim);
      siz.push((0.9+rnd()*1.0+(s.edge?0.35:0))*(0.85+0.3*sc));
      dly.push(s.delay);
    }
  });
  return { pos:pos, bud:bud, col:col, siz:siz, dly:dly };
}

/* ---------- 包装纸 ---------- */
function paperPoints(n){
  var pos=[],col=[],siz=[],dly=[];
  for (var i=0;i<n;i++){
    var th=rnd()*6.283, u=Math.pow(rnd(),0.72);
    var rTop=1.16+0.06*Math.sin(th*5)+0.04*Math.sin(th*11);
    var r=mix(0.22,rTop,u), y=mix(-0.80,0.14,u);
    var fan=1-0.18*Math.max(0,Math.sin(th))*u;
    pos.push(Math.cos(th)*r*fan, y, Math.sin(th)*r*0.72);
    var t=0.35+0.65*u;
    col.push(mix(0.62,0.98,t), mix(0.50,0.86,t), mix(0.56,0.88,t));
    siz.push(0.55+rnd()*0.7);
    dly.push(0.02+u*0.10+rnd()*0.05);
  }
  return { pos:pos, col:col, siz:siz, dly:dly };
}

/* ---------- 粒子文字 ---------- */
function textPoints(){
  var TW=1400, TH=520;
  var c=document.createElement('canvas'); c.width=TW; c.height=TH;
  var g=c.getContext('2d');
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff';
  g.fillStyle='#fff'; g.strokeStyle='#fff'; g.lineJoin='round'; g.lineWidth=7;
  g.font='132px RoseBrush, "Songti SC", serif';
  g.fillText('祝杨子墨天天开心', TW/2, 206);
  g.strokeText('祝杨子墨天天开心', TW/2, 206);
  g.font='92px RoseBrush, "Songti SC", serif';
  g.fillText('—— 严小焕作', TW/2+56, 382);
  g.strokeText('—— 严小焕作', TW/2+56, 382);

  var data=g.getImageData(0,0,TW,TH).data;
  var planeW=2.45, planeH=planeW*TH/TW;
  var pos=[],bud=[],col=[],siz=[],dly=[];
  var step=4;
  for (var y=0;y<TH;y+=step){
    for (var x=0;x<TW;x+=step){
      if (data[(y*TW+x)*4+3] > 120){
        var nx=x/TW-0.5, ny=0.5-y/TH;
        var wx=-0.15+(nx+0.5)*planeW, wy=0.30+ny*planeH;
        pos.push(wx, wy, 0.12+(rnd()-0.5)*0.05);
        bud.push(-1.15+(rnd()-0.5)*1.4, (rnd()-0.5)*1.4, (rnd()-0.5)*0.9);
        var t=nx+0.5;
        col.push(1.0, mix(0.70,0.46,t), mix(0.84,0.70,t));
        siz.push(1.4+rnd()*1.1);
        dly.push(0.30+t*0.35+rnd()*0.10);
      }
    }
  }
  return { pos:pos, bud:bud, col:col, siz:siz, dly:dly };
}

/* ---------- 精灵 ---------- */
var SPRITES=[];
(function(){
  var bands=[[122,32,52],[168,58,84],[204,92,118],[230,132,156],[246,186,200],[255,226,226]];
  bands.forEach(function(col){
    var S=64,o=document.createElement('canvas'); o.width=o.height=S;
    var g=o.getContext('2d');
    var grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    grd.addColorStop(0,'rgba('+col+',1)');
    grd.addColorStop(0.16,'rgba('+col+',.92)');
    grd.addColorStop(0.36,'rgba('+col+',.26)');
    grd.addColorStop(0.60,'rgba('+col+',.05)');
    grd.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=grd; g.fillRect(0,0,S,S);
    SPRITES.push(o);
  });
})();
function bandOf(r,g,b){
  if (g>0.84) return 5;
  if (g>0.68) return 4;
  if (g>0.48) return 3;
  if (g>0.32) return 2;
  if (g>0.20) return 1;
  return 0;
}

/* ---------- 组装 ---------- */
var N_ROSE=11000;
(function(){
  var totalW=ROSES.reduce(function(a,R){ return a+R[3]*R[3]; },0);
  ROSES.forEach(function(R,i){
    var n=Math.round(N_ROSE*(R[3]*R[3])/totalW);
    roseSets[i]=roseSamples(n);
  });
})();
function initAll(){
var poseOpen=buildBouquet(1.0);
var poseBud =buildBouquet(0.06);
var paper=paperPoints(2600);
var text=textPoints();

var layers=[
  {to:poseOpen.pos, from:poseBud.pos, col:poseOpen.col, siz:poseOpen.siz, dly:poseOpen.dly, alpha:0.95, off:[-1.15,0,0]},
  {to:paper.pos, from:paper.pos, col:paper.col, siz:paper.siz, dly:paper.dly, alpha:0.16, off:[-1.15,0,0]},
  {to:text.pos, from:text.bud, col:text.col, siz:text.siz, dly:text.dly, alpha:1.05, off:[0,0,0]}
];

/* ---------- 渲染 ---------- */
var camYaw=0, camPitch=0.05, DIST=5.3;
function resize(){
  DPR=Math.min(devicePixelRatio||1,1.6);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize);

var PERIOD=26;
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var t0=performance.now()/1000;
var lastDraw=0, drawEvery=1, frameAvg=16;

function openAt(p){
  if (p<0.16) return smooth(p/0.16);
  if (p<0.80) return 1;
  if (p<0.96) return 1-smooth((p-0.80)/0.16)*0.94;
  return 0.06;
}

function frame(now){
  var dt = now-lastDraw; lastDraw=now;
  frameAvg = frameAvg*0.92 + dt*0.08;
  if (frameAvg > 26 && drawEvery < 3) drawEvery++;
  else if (frameAvg < 18 && drawEvery > 1) drawEvery--;

  var t=now/1000-t0;
  var open = reduce?1:openAt((t%PERIOD)/PERIOD);
  var yaw = reduce?0:0.20*Math.sin(t*0.11);
  var pitch = camPitch + (reduce?0:0.03*Math.sin(t*0.15));
  var cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  var cx=W/2, cyy=H*0.52;
  var scale=Math.min(W,H)*1.58;
  var basePersp=scale/DIST;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#05000c'; ctx.fillRect(0,0,W,H);
  var gl=ctx.createRadialGradient(cx,H*0.48,0,cx,H*0.48,Math.max(W,H)*0.5);
  var gu=0.035+0.012*Math.sin(t*0.6);
  gl.addColorStop(0,'rgba(120,16,44,'+gu.toFixed(3)+')');
  gl.addColorStop(1,'rgba(5,0,12,0)');
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  for (var L=0;L<layers.length;L++){
    var ly=layers[L];
    var n=ly.to.length/3;
    for (var i=0;i<n;i+=drawEvery){
      var k=smooth((open*1.35 - ly.dly[i]*0.60)/0.40);
      if (k<=0.002) continue;
      var ox=ly.off[0], oy=ly.off[1], oz=ly.off[2];

      var tx=mix(ly.from[i*3],ly.to[i*3],k)+ox;
      var ty=mix(ly.from[i*3+1],ly.to[i*3+1],k)+oy;
      var tz=mix(ly.from[i*3+2],ly.to[i*3+2],k)+oz;

      var x1=tx*cy-tz*sy, z1=tx*sy+tz*cy;
      var y1=ty*cp-z1*sp; z1=ty*sp+z1*cp;

      var persp=scale/(DIST+z1), dr=persp/basePersp;
      var sx=cx+x1*persp, sy2=cyy-y1*persp;
      if (sx<-40||sx>W+40||sy2<-40||sy2>H+40) continue;

      var size=ly.siz[i]*dr*1.55*(0.6+0.4*k);
      if (size<0.3) continue;
      var b=bandOf(ly.col[i*3],ly.col[i*3+1],ly.col[i*3+2]);
      ctx.globalAlpha=Math.min(0.95, ly.alpha*0.32*dr*k*(0.9+0.1*Math.sin(t*2.2+i)));
      var rr=size*2.0;
      ctx.drawImage(SPRITES[b], sx-rr, sy2-rr, rr*2, rr*2);
      if (size > 1.3){
        ctx.globalAlpha *= 0.35;
        var r2=size*1.1;
        ctx.drawImage(SPRITES[b], sx-r2, sy2-r2, r2*2, r2*2);
      }
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
setTimeout(function(){ var s=document.getElementById('sig'); if(s) s.classList.add('off'); }, 7000);
}

(document.fonts && document.fonts.load)
  ? document.fonts.load('132px RoseBrush').then(function(){ document.fonts.ready.then(initAll); }).catch(initAll)
  : initAll();
})();
</script>
</body>
